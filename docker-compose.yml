version: '3.9'

services:
  # ─── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_AI_URL=http://ai-service:8001
    depends_on:
      - backend
    networks:
      - greenpack-net

  # ─── Backend (FastAPI) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://greenpack:greenpack@postgres:5432/greenpack_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=greenpack-super-secret-key-change-in-production
      - POLYGON_RPC=https://polygon-rpc.com
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      - postgres
      - redis
    networks:
      - greenpack-net

  # ─── AI Service ──────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://greenpack:greenpack@postgres:5432/greenpack_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - greenpack-net

  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=greenpack
      - POSTGRES_PASSWORD=greenpack
      - POSTGRES_DB=greenpack_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - greenpack-net

  # ─── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - greenpack-net

  # ─── Nginx (Reverse Proxy) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - greenpack-net

volumes:
  postgres_data:
  redis_data:

networks:
  greenpack-net:
    driver: bridge
